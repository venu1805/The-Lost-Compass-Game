<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Radial Gold Gradient -->
    <radialGradient id="goldBezel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#d4af37" />
      <stop offset="90%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
    <!-- Deep Ocean Dial Gradient -->
    <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <!-- Spectral Glow Filter -->
    <filter id="spectralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Bezel -->
  <circle cx="256" cy="256" r="240" fill="url(#goldBezel)" stroke="#3f2e18" stroke-width="12" />
  
  <!-- Outer Rim Marks -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="4, 12" />

  <!-- Inner Compass Face -->
  <circle cx="256" cy="256" r="200" fill="url(#dialGrad)" stroke="#b45309" stroke-width="6" />

  <!-- Compass Rose Starburst -->
  <g opacity="0.6">
    <polygon points="256,76 270,240 256,256 242,240" fill="#d4af37" />
    <polygon points="256,436 270,272 256,256 242,272" fill="#d4af37" />
    <polygon points="76,256 240,242 256,256 240,270" fill="#d4af37" />
    <polygon points="436,256 272,242 256,256 272,270" fill="#d4af37" />
    <polygon points="128,128 244,244 256,256 244,256" fill="#854d0e" />
    <polygon points="384,128 268,244 256,256 268,256" fill="#854d0e" />
    <polygon points="128,384 244,268 256,256 244,256" fill="#854d0e" />
    <polygon points="384,384 268,268 256,256 268,256" fill="#854d0e" />
  </g>

  <!-- Cardinal Points -->
  <text x="256" y="112" fill="#ef4444" font-family="Georgia, serif" font-size="36" font-weight="bold" text-anchor="middle">N</text>
  <text x="256" y="426" fill="#fef08a" font-family="Georgia, serif" font-size="34" font-weight="bold" text-anchor="middle">S</text>
  <text x="410" y="268" fill="#fef08a" font-family="Georgia, serif" font-size="34" font-weight="bold" text-anchor="middle">E</text>
  <text x="102" y="268" fill="#fef08a" font-family="Georgia, serif" font-size="34" font-weight="bold" text-anchor="middle">W</text>

  <!-- Mystical Glowing Compass Needle -->
  <g filter="url(#spectralGlow)" transform="rotate(28, 256, 256)">
    <!-- North Point (Cursed Ruby Crimson) -->
    <polygon points="256,86 276,256 256,242" fill="#dc2626" />
    <polygon points="256,86 236,256 256,242" fill="#ef4444" />
    <!-- South Point (Spectral Ocean Cyan) -->
    <polygon points="256,426 276,256 256,270" fill="#0284c7" />
    <polygon points="256,426 236,256 256,270" fill="#38bdf8" />
  </g>

  <!-- Central Brass Pivot -->
  <circle cx="256" cy="256" r="26" fill="url(#goldBezel)" stroke="#111" stroke-width="4" />
  <circle cx="256" cy="256" r="12" fill="#22d3ee" filter="url(#spectralGlow)" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />
</svg>
